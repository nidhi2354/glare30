<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Glare30 Institute logo">
  <title>Glare30 Institute</title>

  <!-- Navy field -->
  <circle cx="120" cy="120" r="120" fill="#14235C" />

  <!-- Outer green ring -->
  <circle cx="120" cy="120" r="115.5" fill="none" stroke="#159B4C" stroke-width="8.9" />

  <!-- Inner gold ring -->
