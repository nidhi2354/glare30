    <path fill-rule="evenodd" d="M120 52.4a45.9 45.9 0 1 1 0 91.8 45.9 45.9 0 0 1 0-91.8Zm0 20.1a25.8 25.8 0 1 0 0 51.6 25.8 25.8 0 0 0 0-51.6Z" />
